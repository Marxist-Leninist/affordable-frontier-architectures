<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="370" viewBox="0 0 1140 370" role="img">
<title>Two recurrent orders, identical trainable blocks</title><desc>A and B are distinct ordered ten-block groups. Repeated labels reuse the same weights; I and O each contain eight unique blocks.</desc>
<rect width="100%" height="100%" fill="#ffffff"/><g font-family="Arial,sans-serif" fill="#17212b">
<text x="30" y="31" font-size="21" font-weight="bold">Two recurrent orders, identical trainable blocks</text>
<text x="30" y="56" font-size="12">A and B are distinct ordered ten-block groups. Repeated labels reuse the same weights; I and O each contain eight unique blocks.</text>
<text x="30" y="134" font-size="17">Split: I A A B B O</text>
<rect x="310" y="105" width="108" height="48" rx="7" fill="#e6ebf2"/>
<text x="364" y="135" text-anchor="middle" font-size="20">I</text>
<text x="423" y="134" font-size="18">→</text>
<rect x="440" y="105" width="108" height="48" rx="7" fill="#b9d7f0"/>
<text x="494" y="135" text-anchor="middle" font-size="20">A</text>
<text x="553" y="134" font-size="18">→</text>
<rect x="570" y="105" width="108" height="48" rx="7" fill="#b9d7f0"/>
<text x="624" y="135" text-anchor="middle" font-size="20">A</text>
<text x="683" y="134" font-size="18">→</text>
<rect x="700" y="105" width="108" height="48" rx="7" fill="#f1cfbb"/>
<text x="754" y="135" text-anchor="middle" font-size="20">B</text>
<text x="813" y="134" font-size="18">→</text>
<rect x="830" y="105" width="108" height="48" rx="7" fill="#f1cfbb"/>
<text x="884" y="135" text-anchor="middle" font-size="20">B</text>
<text x="943" y="134" font-size="18">→</text>
<rect x="960" y="105" width="108" height="48" rx="7" fill="#e6ebf2"/>
<text x="1014" y="135" text-anchor="middle" font-size="20">O</text>
<text x="30" y="236" font-size="17">Whole: I A B A B O</text>
<rect x="310" y="207" width="108" height="48" rx="7" fill="#e6ebf2"/>
<text x="364" y="237" text-anchor="middle" font-size="20">I</text>
<text x="423" y="236" font-size="18">→</text>
<rect x="440" y="207" width="108" height="48" rx="7" fill="#b9d7f0"/>
<text x="494" y="237" text-anchor="middle" font-size="20">A</text>
<text x="553" y="236" font-size="18">→</text>
<rect x="570" y="207" width="108" height="48" rx="7" fill="#f1cfbb"/>
<text x="624" y="237" text-anchor="middle" font-size="20">B</text>
<text x="683" y="236" font-size="18">→</text>
<rect x="700" y="207" width="108" height="48" rx="7" fill="#b9d7f0"/>
<text x="754" y="237" text-anchor="middle" font-size="20">A</text>
<text x="813" y="236" font-size="18">→</text>
<rect x="830" y="207" width="108" height="48" rx="7" fill="#f1cfbb"/>
<text x="884" y="237" text-anchor="middle" font-size="20">B</text>
<text x="943" y="236" font-size="18">→</text>
<rect x="960" y="207" width="108" height="48" rx="7" fill="#e6ebf2"/>
<text x="1014" y="237" text-anchor="middle" font-size="20">O</text>
<text x="30" y="312" font-size="14">Training r=2: 36 unique blocks, 56 applications, 764,304 parameters. General form: I A^r B^r O versus I (AB)^r O.</text>
<text x="30" y="342" font-size="13">r=0 bypasses only the middle: all 16 outer attention blocks remain. The separate 0–100 sweep does not retrain models.</text>
</g></svg>
